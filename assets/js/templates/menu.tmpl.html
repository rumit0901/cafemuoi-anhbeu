<!-- 
  jsRender Template: Render thẻ từng món trong danh sách thực đơn (Menu).
  Quy ước đặt tên id: menuItemTemplate
-->
<script type="text/x-jsrender" id="menuItemTemplate">
  <div class="menu-item-card">
    <div class="card-img-wrapper">
      <!-- Ảnh món ăn / thức uống -->
      <img src="{{:image}}" alt="{{:name}}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500&auto=format&fit=crop&q=80'">
      
      {{if tag}}
        <!-- Badge nhãn nổi bật (Best Seller / New / Featured) -->
        <span class="card-badge badge {{if tag === 'best-seller'}}badge-best-seller{{else}}badge-new{{/if}}">
          {{if tag === 'best-seller'}}🔥 Best Seller{{else}}✨ Món Mới{{/if}}
        </span>
      {{/if}}
    </div>

    <div class="card-content">
      <div class="card-header-row">
        <!-- Tên sản phẩm -->
        <h3 class="item-title">{{:name}}</h3>
        <!-- Giá hiển thị định dạng VNĐ -->
        <span class="item-price">{{:price.toLocaleString('vi-VN')}}đ</span>
      </div>

      <!-- Mô tả sản phẩm -->
      <p class="item-desc">{{:description || 'Hương vị cà phê nồng nàn kết hợp cùng lớp kem muối béo ngậy đặc trưng.'}}</p>

      <div class="card-footer">
        <button class="btn btn-primary btn-sm btn-order" data-id="{{:id}}" data-name="{{:name}}">
          ☕ Đặt món ngay
        </button>
      </div>
    </div>
  </div>
</script>
