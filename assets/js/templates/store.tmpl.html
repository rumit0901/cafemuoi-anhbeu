<!-- 
  jsRender Template: Render thông tin thẻ cửa hàng chi nhánh (Store Card).
  Quy ước đặt tên id: storeItemTemplate
-->
<script type="text/x-jsrender" id="storeItemTemplate">
  <div class="store-item-card" data-lat="{{:lat}}" data-lng="{{:lng}}">
    <h3 class="store-name">{{:name}}</h3>
    <p class="store-address">📍 {{:address}}</p>
    <div class="store-details">
      <div>📞 Hotline: <strong>{{:phone}}</strong></div>
      <div>🕒 Giờ mở cửa: <strong>{{:hours}}</strong></div>
    </div>
    <div class="store-actions">
      <button class="btn btn-primary btn-sm btn-focus-map" data-lat="{{:lat}}" data-lng="{{:lng}}">
        🗺️ Xem Trên Bản Đồ
      </button>
    </div>
  </div>
</script>
