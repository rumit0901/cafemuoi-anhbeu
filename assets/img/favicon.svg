<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Dynamic Gradient Background Circle -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1a12" />
      <stop offset="100%" stop-color="#1a0f0a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e59866" />
      <stop offset="100%" stop-color="#d35400" />
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f9f3ea" />
    </linearGradient>
  </defs>

  <!-- Base Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Steam Rise Animation Effect / Paths -->
  <path d="M40 26 Q43 20 40 14" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85" />
  <path d="M50 24 Q53 18 50 12" stroke="url(#goldGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M60 26 Q63 20 60 14" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85" />

  <!-- Coffee Cup Body -->
  <path d="M28 40 L34 74 C35 79 40 82 50 82 C60 82 65 79 66 74 L72 40 Z" fill="#3d2314" stroke="#e59866" stroke-width="2" />
  
  <!-- Salt Cream Topping Layer -->
  <path d="M26 38 Q38 46 50 38 Q62 46 74 38 L72 44 Q60 50 50 44 Q40 50 28 44 Z" fill="url(#creamGrad)" />
  
  <!-- Cup Handle -->
  <path d="M70 46 C79 46 81 64 68 66" stroke="url(#goldGrad)" stroke-width="4.5" fill="none" stroke-linecap="round" />
</svg>
