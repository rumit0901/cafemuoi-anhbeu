<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khách Hàng Đánh Giá — Cà Phê Muối Anh Bếu</title>
  <meta name="description" content="Xem cảm nhận thực tế của khách hàng về cà phê muối anh Bếu. Đánh giá 5 sao về chất lượng đồ uống và dịch vụ tuyệt vời.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Favicon Icons -->
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/logo.png">

  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .page-banner {
      background: radial-gradient(circle at top right, rgba(229, 152, 102, 0.2), transparent 40%),
                  linear-gradient(135deg, var(--primary-coffee), #2b1810);
      color: var(--accent-cream);
      padding: 140px 0 70px 0;
      text-align: center;
      border-bottom-left-radius: 40px;
      border-bottom-right-radius: 40px;
    }
    .page-banner h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo"><img src="assets/img/logo.png" alt="Cà phê muối anh Bếu Logo" class="logo-img" onerror="this.onerror=null; this.replaceWith(Object.assign(document.createElement('span'), {className: 'logo-icon', innerHTML: '☕'}));"><span>Cà phê muối anh Bếu</span></a>
      <nav class="main-nav" id="main-navigation">
        <a href="index.html" class="nav-link">Trang Chủ</a>
        <a href="story.html" class="nav-link">Câu Chuyện</a>
        <a href="contact.html" class="nav-link">Liên Hệ</a>
      </nav>
      <button class="mobile-toggle" id="mobile-menu-toggle">☰</button>
    </div>
  </header>

  <section style="padding: 60px 0;">
    <div class="container">
      <div class="section-header reveal-on-scroll">
        <span class="section-subtitle">Góc Nhận Xét</span>
        <h1 class="section-title">Khách Hàng Nói Gì Về Anh Bếu?</h1>
      </div>

      <div id="reviews-container" class="reviews-grid">
        <div class="skeleton-card reveal-on-scroll"><div class="skeleton-box" style="height: 100px;"></div></div>
        <div class="skeleton-card reveal-on-scroll stagger-1"><div class="skeleton-box" style="height: 100px;"></div></div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container"><div class="footer-bottom"><p>&copy; 2026 Cà Phê Muối Anh Bếu. All rights reserved.</p></div></div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrender/1.0.13/jsrender.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>

  <!-- Embed jsRender Template Reviews -->
  <script type="text/x-jsrender" id="reviewTemplate">
    <div class="review-card amber-glow-card reveal-on-scroll">
      <div class="review-header">
        <div class="customer-avatar"><img src="{{:avatar}}" alt="{{:customer}}"></div>
        <div>
          <h4 class="customer-name">{{:customer}}</h4>
          <div class="rating-stars">⭐⭐⭐⭐⭐</div>
        </div>
      </div>
      <p class="review-comment">"{{:comment}}"</p>
      <span class="review-date">{{:date}}</span>
    </div>
  </script>

  <script src="assets/js/pages/reviews.page.js"></script>
  <script src="assets/js/animations.js"></script>
  <script> $('#mobile-menu-toggle').on('click', function() { $('#main-navigation').toggleClass('active'); }); </script>
</body>
</html>
